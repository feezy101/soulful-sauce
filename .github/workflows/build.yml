name: Build Soulful Sauce

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (VST3 + AU + Standalone)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja || true

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}-v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Check the engine matches the FL script
        run: ./build/EngineParityTest tests/reference_cases.txt

      - name: Package
        run: |
          A="build/SoulfulSauce_artefacts/Release"
          P="Soulful Sauce"
          mkdir -p "$P"
          cp -R "$A/VST3/Soulful Sauce.vst3" "$P/"
          cp -R "$A/AU/Soulful Sauce.component" "$P/"
          cp -R "$A/Standalone/Soulful Sauce.app" "$P/"
          for f in "$P"/*.vst3 "$P"/*.component "$P"/*.app; do codesign --force --deep --sign - "$f"; done
          cp "packaging/Install Soulful Sauce.command" "$P/"
          chmod +x "$P/Install Soulful Sauce.command"
          cp packaging/READ-ME-FIRST.txt "$P/"
          ditto -c -k --sequesterRsrc --keepParent "$P" Soulful-Sauce-mac.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Soulful-Sauce-mac
          path: Soulful-Sauce-mac.zip

      - name: Validate the Audio Unit
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/SoulfulSauce_artefacts/Release/AU/Soulful Sauce.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu SSau JFzy

      - name: Stress-test the VST3 with pluginval
        run: |
          curl -sSfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 7 --validate-in-process --timeout-ms 120000 \
            "build/SoulfulSauce_artefacts/Release/VST3/Soulful Sauce.vst3"

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Soulful-Sauce-mac.zip
